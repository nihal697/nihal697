name: GitHub-Profile-Summary-Cards

on:
  schedule: # every Sunday at midnight
    - cron: "0 0 * * 0"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/profile-summary-cards.yml

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          # NOTE: a personal token with repo+read:user would give true view
          # counts, but the stored token lacked read:user and broke the stats
          # cards entirely — GITHUB_TOKEN renders everything except exact views.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          BRANCH_NAME: profile-summary-card-output
