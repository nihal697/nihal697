name: GitHub-Profile-Summary-Cards

on:
  schedule: # every Sunday at midnight
    - cron: "0 0 * * 0"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/profile-summary-cards.yml

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          BRANCH_NAME: profile-summary-card-output

      # The action's built-in push is flaky (silent no-op); make the
      # output branch exist for real.
      - name: Publish output branch
        run: |
          git status --short | head -n 5
          git branch -a
          git log --oneline -3
          git push -u origin profile-summary-card-output
