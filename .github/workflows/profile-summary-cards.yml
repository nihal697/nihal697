name: GitHub-Profile-Summary-Cards

# One run at a time: duplicate runs race on the same commit and the loser
# fails its git push — each failure sends you an email.
concurrency:
  group: profile-summary-cards
  cancel-in-progress: true

on:
  schedule: # every Sunday at midnight
    - cron: "0 0 * * 0"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/profile-summary-cards.yml

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          # Personal token (repo + read:user) — true view counts.
          GITHUB_TOKEN: ${{ secrets.METRICS_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          BRANCH_NAME: profile-summary-card-output
